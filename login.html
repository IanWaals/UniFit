<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="Version" content="1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unifit – Sign in</title>
    <link rel="stylesheet" href="/css/loginpage.css">
    <script type="module" src="/js/login.js"></script>
</head>
<body>
    <main class="login-box">
        <h1 id="login-message">Please sign in with your Unifit account.</h1>

        <!-- novalidate: we show our own messages; the server validates again anyway -->
        <form id="login-form" novalidate>
            <div>
                <label for="email">Username</label>
                <input class="usernameinput-box" type="email" id="email" name="email"
                       placeholder="u123456@unifit.org" autocomplete="username" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input class="password-input-box" type="password" id="password" name="password"
                       placeholder="Your password" autocomplete="current-password" required>
            </div>

            <div>
                <label for="kmsi">Keep me signed in.</label>
                <input class="kmsi" type="checkbox" id="kmsi" name="Keep me signed in">
            </div>

            <!-- Errors/status are written here by login.js. aria-live makes screen readers announce it. -->
            <p id="form-status" role="status" aria-live="polite"></p>

            <div id="submission-area">
                <button type="submit" class="login-btn login-btn-primary">Log in</button>
                <a href="/signup.html" class="login-btn">Sign up</a>
            </div>
        </form>

        <p id="notice-str">
            Forgot your password? <a href="/resetpass.html">Click here to recover it.</a>.
        </p>

        <p id="copyright-str">&copy; 2026 Unifit.org</p>
    </main>
</body>
</html>
